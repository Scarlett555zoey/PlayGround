<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Wildlife of Glacier</title>
<style>
:root{--glass:rgba(8,15,17,.82);--cream:#ece6d7;--sage:#9fc2a9;--gold:#d2bd91}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071013;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef3ec}canvas{display:block;width:100%;height:100%}
#game{position:absolute;inset:0}.overlay{position:absolute;inset:0;pointer-events:none}.screen{position:absolute;inset:0;z-index:20;background:linear-gradient(90deg,rgba(4,10,12,.98) 0%,rgba(5,13,15,.92) 38%,rgba(5,13,15,.54) 58%,rgba(5,13,15,.08) 78%,transparent),radial-gradient(circle at 72% 46%,rgba(91,112,91,.22),transparent 32%);display:flex;align-items:center;padding:4.5vw 5.5vw;transition:opacity .55s ease}.screen.hidden{opacity:0;pointer-events:none}
.brand{position:absolute;top:38px;left:5.5vw}.brand small{display:block;color:#afbaaf;font-size:10px;letter-spacing:5px}.brand h1{margin:8px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,4.2vw,62px);font-weight:400;letter-spacing:-1px;text-shadow:0 3px 24px #000}
.selectbox{width:min(610px,42vw);margin-top:58px}.eyebrow{color:#a6cbb3;font-size:11px;letter-spacing:4px;text-transform:uppercase}.selectbox h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,2.8vw,44px);font-weight:400;margin:8px 0 22px}
.species-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:330px;overflow:auto;padding-right:4px}.species-grid::-webkit-scrollbar{width:3px}.species-grid::-webkit-scrollbar-thumb{background:#7b9482}.species{min-height:58px;border:1px solid rgba(230,238,225,.12);background:rgba(240,246,238,.055);color:#edf2ec;border-radius:3px;cursor:pointer;text-align:left;padding:10px 11px;transition:.18s}.species:hover{background:rgba(158,196,174,.12);border-color:rgba(196,220,203,.38)}.species.active{background:linear-gradient(135deg,rgba(173,205,183,.24),rgba(91,126,104,.13));border-color:#b4cebc;box-shadow:inset 3px 0 #b4cebc}.species b{display:block;font-family:Georgia,serif;font-size:14px;font-weight:400}.species span{display:block;color:#b3beb4;font-size:9px;margin-top:5px;text-transform:uppercase;letter-spacing:1.2px}
.sex-row{display:flex;align-items:center;gap:7px;margin:15px 0}.sex-row:before{content:"Sex";color:#9da99f;font-size:10px;text-transform:uppercase;letter-spacing:2px;margin-right:7px}.sex{border:1px solid rgba(255,255,255,.15);border-radius:30px;color:#cad2cb;background:rgba(0,0,0,.12);padding:8px 19px;font-size:12px;cursor:pointer}.sex.active{background:var(--cream);color:#172019;border-color:var(--cream)}
.start{border:0;border-radius:3px;background:var(--cream);color:#172019;padding:14px 30px;font-weight:800;font-size:11px;letter-spacing:1.8px;cursor:pointer;box-shadow:0 10px 35px rgba(0,0,0,.28)}.start:hover{background:white}
.portrait{position:absolute;right:4.8vw;top:50%;width:min(43vw,680px);height:62vh;transform:translateY(-44%);pointer-events:none}.portrait-card{position:absolute;inset:0;background:radial-gradient(ellipse at 55% 52%,rgba(200,210,185,.13),transparent 48%);border-radius:50%;filter:drop-shadow(0 25px 25px rgba(0,0,0,.35));display:flex;align-items:center;justify-content:center}.portrait-silhouette{position:relative;width:78%;height:62%;opacity:.94}.portrait-silhouette:before{content:"";position:absolute;left:14%;top:19%;width:58%;height:44%;border-radius:52% 48% 45% 55%;background:var(--portrait,var(--fur));box-shadow:inset -34px -18px 35px rgba(0,0,0,.26),inset 20px 12px 30px rgba(255,255,255,.06)}.portrait-silhouette:after{content:"";position:absolute;right:8%;top:25%;width:34%;height:32%;border-radius:48% 58% 48% 52%;background:var(--portrait,var(--fur));box-shadow:inset -18px -10px 24px rgba(0,0,0,.28)}.portrait-ear{position:absolute;right:20%;top:12%;width:13%;height:25%;border-radius:80% 20% 70% 30%;background:var(--portrait,var(--fur));transform:rotate(18deg);z-index:2}.portrait-leg{position:absolute;left:25%;top:56%;width:9%;height:30%;border-radius:40%;background:var(--portrait,var(--fur));box-shadow:170px 0 var(--portrait,var(--fur));transform:rotate(-2deg)}
.portrait-name{position:absolute;right:3.5%;bottom:2%;text-align:right;text-shadow:0 3px 16px #000}.portrait-name b{display:block;font-family:Georgia,serif;font-size:clamp(22px,3vw,42px);font-weight:400}.portrait-name span{display:block;margin-top:5px;color:#d1dacd;font-size:10px;text-transform:uppercase;letter-spacing:3px}
.hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between}.location{text-transform:uppercase}.location b,.location span{display:block}.location b{font-family:Georgia,serif;font-size:16px}.location span{margin-top:5px;font-size:9px;letter-spacing:2px;color:#c0cbbf}.compass{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:5px;color:#dce4dc}.crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;border:1px solid white;border-radius:50%;transform:translate(-50%,-50%);opacity:.7}.toast{position:absolute;top:14%;left:50%;transform:translate(-50%,-10px);background:rgba(8,15,16,.72);border:1px solid rgba(255,255,255,.12);padding:10px 18px;border-radius:2px;font-size:12px;opacity:0;transition:.3s}.toast.show{opacity:1}.stats{position:absolute;left:22px;bottom:25px;width:210px}.stat{display:grid;grid-template-columns:62px 1fr;align-items:center;margin:7px 0}.stat-name{font-size:9px;text-transform:uppercase;letter-spacing:1px}.bar{height:4px;background:rgba(255,255,255,.14)}.fill{height:100%;width:82%;background:#a9cbb1}.fill.health{width:92%;background:#b7cbb5}.fill.hunger{width:68%;background:#d2c194}.actions{position:absolute;right:22px;bottom:24px;display:flex;gap:8px}.action{width:43px;height:43px;border:1px solid rgba(255,255,255,.13);border-radius:50%;background:rgba(8,15,16,.62);color:white;pointer-events:auto;font-size:16px}.callbox{position:absolute;right:22px;bottom:78px;width:150px;background:rgba(8,15,16,.86);border:1px solid rgba(255,255,255,.12);padding:5px;display:none;pointer-events:auto}.callbox.open{display:block}.call{display:block;width:100%;padding:8px;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:transparent;color:white;text-align:left}.mobile{display:none}
@media(max-width:800px){.screen{padding:22px}.selectbox{width:54vw}.portrait{right:-8vw;width:50vw}.species-grid{grid-template-columns:repeat(2,1fr)}.brand{top:20px}.selectbox{margin-top:80px}.species b{font-size:12px}.mobile{display:block;position:absolute;left:25px;bottom:100px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:auto}.stick{position:absolute;width:36px;height:36px;left:22px;top:22px;border-radius:50%;background:rgba(255,255,255,.28)}}
</style></style>
</head>
<body>
<div id="game"></div>
<div id="menu" class="screen">
  <div class="brand"><small>GLACIER NATIONAL PARK · MONTANA</small><h1>Wildlife</h1></div>
  <div class="selectbox">
    <div class="eyebrow">Choose your life</div><h2>Select an animal</h2>
    <div id="speciesGrid" class="species-grid"></div>
    <div class="sex-row"><button class="sex active" data-sex="Female">Female</button><button class="sex" data-sex="Male">Male</button></div>
    <button id="start" class="start">ENTER THE WILD</button>
  </div>
  <div class="portrait"><div class="portrait-card"><div class="portrait-silhouette"><i class="portrait-ear"></i><i class="portrait-leg"></i></div></div><div class="portrait-name"><b id="portraitName">Gray Wolf</b><span id="portraitType">CANID · FEMALE</span></div></div>
</div>
<div class="overlay"><div class="hud"><div class="topbar"><div class="location"><b id="place">Lake McDonald</b><span id="speciesName">GRAY WOLF · FEMALE</span></div><div class="location"><b id="clock">6:10 AM</b><span id="ageText">SUBADULT</span></div></div><div class="compass">W &nbsp;&nbsp; · &nbsp;&nbsp; N &nbsp;&nbsp; · &nbsp;&nbsp; E</div><div class="crosshair"></div><div id="toast" class="toast">You entered a new region</div><div class="stats"><div class="stat"><span class="stat-name">Health</span><div class="bar"><div id="health" class="fill health"></div></div></div><div class="stat"><span class="stat-name">Hunger</span><div class="bar"><div id="hunger" class="fill hunger"></div></div></div><div class="stat"><span class="stat-name">Water</span><div class="bar"><div id="water" class="fill"></div></div></div></div><div id="callbox" class="callbox"><button class="call" data-call="Call">Chirp</button><button class="call" data-call="Call">Howl / bark</button><button class="call" data-call="Call">Whimper</button><button class="call" data-call="Call">Alarm call</button></div><div class="actions"><button class="action" id="calls">♫</button><button class="action" id="drink">💧</button><button class="action" id="attack">⌁</button><button class="action" id="sprint">➤</button></div><div class="mobile" id="joystick"><div class="stick" id="stick"></div></div></div></div>
<script type="module" src="game.js"></script>
</body>
</html>
