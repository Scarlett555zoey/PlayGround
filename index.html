<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Wildlife of Glacier</title>
<style>
:root{--glass:rgba(10,18,20,.78);--gold:#d8c49b;--mint:#82c5a4}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071013;font-family:Inter,ui-sans-serif,system-ui;color:#eef3ec}canvas{display:block;width:100%;height:100%}#game{position:absolute;inset:0}.overlay{position:absolute;inset:0;pointer-events:none}.panel{pointer-events:auto}.screen{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,12,14,.94) 0,rgba(4,12,14,.74) 38%,rgba(4,12,14,.12) 68%,transparent),linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.5));display:flex;align-items:center;padding:5vw;transition:.5s}.screen.hidden{opacity:0;pointer-events:none}.brand{position:absolute;top:32px;left:5vw}.brand small{display:block;color:#aeb9af;font-size:11px;letter-spacing:5px}.brand h1{margin:7px 0 0;font-family:Georgia,serif;font-size:clamp(30px,4vw,58px);font-weight:500}.selectbox{width:min(620px,92vw);margin-top:40px}.eyebrow{color:#9ccbb1;font-size:12px;letter-spacing:3px;text-transform:uppercase}.selectbox h2{font-family:Georgia,serif;font-size:clamp(24px,3vw,38px);margin:8px 0 18px}.species-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.species{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:white;padding:12px 9px;border-radius:5px;cursor:pointer;text-align:left}.species:hover,.species.active{background:rgba(155,194,170,.18);border-color:#9fc5ad}.species b{display:block;font-size:14px}.species span{display:block;color:#aab5ac;font-size:10px;margin-top:3px}.sex-row{display:flex;gap:8px;margin:12px 0}.sex{border:1px solid rgba(255,255,255,.12);border-radius:30px;color:#cbd3cc;background:transparent;padding:8px 18px}.sex.active{background:#dce7df;color:#17201b}.start{border:0;border-radius:4px;background:#dfe8de;color:#152019;padding:13px 28px;font-weight:800;margin-top:12px}.hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between}.location{background:var(--glass);border:1px solid rgba(255,255,255,.08);border-radius:4px;padding:9px 13px;backdrop-filter:blur(8px)}.location b{display:block;font-family:Georgia;font-size:15px}.location span{font-size:10px;color:#adb9b1;letter-spacing:1px}.stats{position:absolute;left:22px;bottom:28px;width:210px}.stat{height:28px;margin:6px 0;display:flex;align-items:center;gap:8px}.stat-name{width:44px;font-size:9px;color:#cad5ce;text-transform:uppercase}.bar{flex:1;height:5px;background:rgba(0,0,0,.5);border-radius:5px}.fill{height:100%;border-radius:5px;background:#9bd1a9;width:100%;transition:.3s}.fill.hunger{background:#d7bf77}.fill.health{background:#9aaec2}.actions{position:absolute;right:22px;bottom:25px;display:flex;gap:8px;align-items:flex-end}.action{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,18,20,.72);color:white;display:grid;place-items:center;font-size:20px;cursor:pointer}.action small{position:absolute;bottom:-16px;font-size:8px;color:#ccd5cf}.callbox{position:absolute;right:22px;bottom:96px;width:190px;background:var(--glass);border-radius:5px;padding:8px;display:none}.callbox.open{display:block}.call{pointer-events:auto;width:100%;text-align:left;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:none;color:white;padding:8px}.crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;border:1px solid white;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 3px #000}.compass{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:280px;text-align:center;color:#dce4dd;font-size:10px;letter-spacing:10px;text-shadow:0 1px 4px #000}.toast{position:absolute;top:85px;left:50%;transform:translateX(-50%);background:rgba(12,20,19,.82);padding:9px 14px;border-radius:20px;font-size:12px;opacity:0;transition:.25s}.toast.show{opacity:1}.mobile{display:none}@media(max-width:760px){.brand{top:18px}.screen{padding:18px;align-items:flex-end;padding-bottom:30px}.brand h1{font-size:29px}.selectbox{margin-top:0}.species-grid{grid-template-columns:repeat(2,1fr)}.species{padding:9px}.species b{font-size:12px}.stats{left:12px;bottom:110px;width:150px}.actions{right:10px;bottom:40px}.action{width:50px;height:50px}.mobile{display:block;position:absolute;left:18px;bottom:30px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:auto}.stick{position:absolute;width:38px;height:38px;border-radius:50%;background:rgba(230,237,232,.7);left:27px;top:27px}.compass{width:150px}.topbar{left:10px;right:10px}.location{padding:7px}.location b{font-size:12px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="menu" class="screen">
  <div class="brand"><small>GLACIER NATIONAL PARK · MONTANA</small><h1>Wildlife</h1></div>
  <div class="selectbox">
    <div class="eyebrow">Choose your life</div><h2>Select an animal</h2>
    <div id="speciesGrid" class="species-grid"></div>
    <div class="sex-row"><button class="sex active" data-sex="Female">Female</button><button class="sex" data-sex="Male">Male</button></div>
    <button id="start" class="start">ENTER THE WILD</button>
  </div>
</div>
<div class="overlay"><div class="hud"><div class="topbar"><div class="location"><b id="place">Lake McDonald</b><span id="speciesName">GRAY WOLF · FEMALE</span></div><div class="location"><b id="clock">6:10 AM</b><span id="ageText">SUBADULT</span></div></div><div class="compass">W &nbsp;&nbsp; · &nbsp;&nbsp; N &nbsp;&nbsp; · &nbsp;&nbsp; E</div><div class="crosshair"></div><div id="toast" class="toast">You entered a new region</div><div class="stats"><div class="stat"><span class="stat-name">Health</span><div class="bar"><div id="health" class="fill health"></div></div></div><div class="stat"><span class="stat-name">Hunger</span><div class="bar"><div id="hunger" class="fill hunger"></div></div></div><div class="stat"><span class="stat-name">Water</span><div class="bar"><div id="water" class="fill"></div></div></div></div><div id="callbox" class="callbox"><button class="call" data-call="Call">Chirp</button><button class="call" data-call="Call">Howl / bark</button><button class="call" data-call="Call">Whimper</button><button class="call" data-call="Call">Alarm call</button></div><div class="actions"><button class="action" id="calls">♫</button><button class="action" id="drink">💧</button><button class="action" id="attack">⌁</button><button class="action" id="sprint">➤</button></div><div class="mobile" id="joystick"><div class="stick" id="stick"></div></div></div></div>
<script type="module" src="game.js"></script>
</body>
</html>
